<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const miniCanvas=document.getElementById('miniCanvas'),miniCtx=miniCanvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const $=id=>document.getElementById(id);
const ui={menu:$('menu'),pause:$('pauseMenu'),bag:$('bagMenu'),profile:$('profileMenu'),rank:$('rankMenu'),multi:$('multiMenu'),end:$('endMenu'),toast:$('toast')};

const weapons=[
 {name:'Rusty Blade',damage:16,cost:0,unlock:0,desc:'Starter melee weapon.',range:75,kind:'melee'},
 {name:'Chicken Launcher',damage:28,cost:150,unlock:1,desc:'Fires explosive clucking chickens!',range:320,kind:'gun'},
 {name:'Banana Peel Gun',damage:22,cost:280,unlock:2,desc:'Slips and damages zombies.',range:280,kind:'gun'},
 {name:'Shotgun',damage:55,cost:500,unlock:3,desc:'Close-range heavy blast.',range:180,kind:'gun'},
 {name:'Laser Disco Ball',damage:42,cost:850,unlock:4,desc:'Spawns party zones where zombies dance.',range:350,kind:'gun'},
 {name:'Wasteland Reaper',damage:78,cost:1500,unlock:5,desc:'Legendary survival sword.',range:110,kind:'melee'}
];

const pets=[
 {name:'None',desc:'No companion',buff:'None',cost:0},
 {name:'Doge (Loot+)',desc:'Gathers extra coins',buff:'+50% Coins',cost:200},
 {name:'Battle Duck',desc:'Fires laser zaps',buff:'Auto-attack',cost:450},
 {name:'Mini Robot',desc:'Shield protection',buff:'+20 Max HP',cost:800}
];

const skins=[
 {name:'Blue Recruit',color:'#5ba5e8',cost:0},
 {name:'Golden Chicken Suit',color:'#ffd166',cost:300},
 {name:'Cyber Samurai',color:'#ff5d73',cost:600},
 {name:'Zombie Clown',color:'#65e6a7',cost:1000}
];

let state={
 running:false,paused:false,dead:false,day:1,hp:100,maxHp:100,xp:0,level:1,coins:0,kills:0,
 weapon:0,unlocked:[0],upgrade:0,sound:true,score:0,playerName:'Survivor',countryFlag:'🇲🇲',
 skin:0,skinUnlocked:[0],pet:0,grenades:3,roomCode:''
};

try{
 let saved=JSON.parse(localStorage.getItem('last1percent_save_v2')||'null');
 if(saved&&typeof saved==='object'){
  state={...state,...saved};
  state.unlocked=Array.isArray(state.unlocked)?state.unlocked:[0];
  state.skinUnlocked=Array.isArray(state.skinUnlocked)?state.skinUnlocked:[0];
 }
}catch(e){localStorage.removeItem('last1percent_save_v2');}

state.running=false;
state.paused=false;
state.dead=false;
if(!state.maxHp||isNaN(state.maxHp)||state.maxHp<=0)state.maxHp=100;
state.hp=state.maxHp;

let player={x:0,y:0,angle:0,r:15,speed:130,attack:0,attackType:'light',cooldown:0,dodge:0,block:false,flash:0};
let zombies=[],particles=[],floatTexts=[],items=[];
let combo=0,comboTimer=0;
let camera={x:0,y:0};
let keys={},move={x:0,y:0},stickPointer=null,dragLook=false,lookLastX=0,spawnTimer=0,dayTimer=0,toastTimer=0;
const world={w:2400,h:2400};

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function save(){try{localStorage.setItem('last1percent_save_v2',JSON.stringify({...state,running:false,paused:false,dead:false}));}catch(e){}}
function notify(s){ui.toast.textContent=s;ui.toast.classList.remove('hidden');toastTimer=2.3}
function setOverlay(which){Object.values(ui).forEach(e=>{if(e&&e.classList)e.classList.add('hidden')});if(which)which.classList.remove('hidden')}

function resetRun(){
 combo=0;comboTimer=0;floatTexts=[];items=[];zombies=[];particles=[];
 state.running=true;state.paused=false;state.dead=false;state.hp=state.maxHp;state.day=1;state.xp=0;state.kills=0;state.grenades=3;
 player.x=0;player.y=0;player.angle=0;player.attack=0;player.cooldown=0;player.dodge=0;
 spawnTimer=0;dayTimer=0;
 for(let i=0;i<6;i++)spawnZombie();
 setOverlay(null);notify('Survive the horde!');updateUI();
}

function spawnZombie(){
 let a=rand(0,Math.PI*2),r=rand(350,650),typeRoll=Math.random();
 let type=typeRoll<.5?0:typeRoll<.75?1:typeRoll<.9?2:3;
 let types=[
  {name:'Walker',hp:35,speed:32,damage:6,r:14,color:'#91a47d',xp:10,coin:4},
  {name:'Runner',hp:25,speed:55,damage:5,r:12,color:'#e2b56d',xp:14,coin:6},
  {name:'Brute',hp:90,speed:20,damage:14,r:19,color:'#b96965',xp:25,coin:12},
  {name:'Disco Zombie',hp:50,speed:42,damage:8,r:15,color:'#a69ae0',xp:20,coin:9}
 ];
 let t=types[type];
 zombies.push({x:clamp(player.x+Math.cos(a)*r,-world.w/2,world.w/2),y:clamp(player.y+Math.sin(a)*r,-world.h/2,world.h/2),...t,maxHp:t.hp,attack:rand(.2,1.5),hit:0,dead:false});
}

function updateUI(){
 try{
  $('hpText').textContent=Math.max(0,Math.ceil(state.hp))+'/'+state.maxHp;
  $('hpFill').style.width=clamp(state.hp/state.maxHp*100,0,100)+'%';
  $('xpText').textContent=state.xp+'/'+(state.level*100);
  $('xpFill').style.width=clamp(state.xp/(state.level*100)*100,0,100)+'%';
  $('coinText').textContent=state.coins;
  $('killText').textContent=state.kills;
  $('comboText').textContent=combo;
  $('waveLabel').textContent='· DAY '+state.day;
 }catch(e){}
}

function addXP(n){
 state.xp+=n;
 while(state.xp>=state.level*100){
  state.xp-=state.level*100;state.level++;state.maxHp+=10;state.hp=Math.min(state.maxHp,state.hp+35);
  notify('LEVEL UP! Level '+state.level);
 }
 updateUI();
}

function attack(type){
 if(!state.running||state.paused||state.dead||player.cooldown>0)return;
 player.attack=.22;player.attackType=type;player.cooldown=type==='heavy'?.65:.32;
 const weapon=weapons[state.weapon]||weapons[0];
 let dmg=(weapon.damage+state.upgrade*7)*(type==='heavy'?1.7:1);
 let range=weapon.kind==='gun'?weapon.range:(type==='heavy'?Math.max(95,weapon.range||75):Math.max(75,weapon.range||75));
 let hitCount=0;

 for(const z of zombies){
  if(z.dead)continue;
  let dx=z.x-player.x,dy=z.y-player.y,d=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);
  let diff=Math.atan2(Math.sin(ang-player.angle),Math.cos(ang-player.angle));
  if(d<range+z.r&&Math.abs(diff)<(weapon.kind==='gun'?.3:1.1)){
   z.hp-=dmg;z.hit=.15;hitCount++;
   for(let i=0;i<4;i++)particles.push({x:z.x,y:z.y,vx:rand(-50,50),vy:rand(-50,50),life:rand(.1,.3),color:'#ffd166'});
   if(z.hp<=0){
    z.dead=true;state.kills++;combo++;comboTimer=3;
    let coinMult=state.pet===1?1.5:1;
    let coinReward=Math.floor((z.coin+(combo>=3?5:0))*coinMult);
    state.coins+=coinReward;addXP(z.xp);
    floatTexts.push({x:z.x,y:z.y-18,text:'+'+z.xp+' XP +'+coinReward+'C',life:1.2,color:'#ffe27a'});
    if(Math.random()<.3) items.push({x:z.x,y:z.y,type:Math.random()<.5?'hp':'coin',val:Math.random()<.5?20:15});
    if(state.kills%8===0){state.day++;state.coins+=25;state.hp=Math.min(state.maxHp,state.hp+20);notify('DAY '+state.day+' REACHED!');}
    save();
   }
  }
 }
 if(hitCount)playSound(200,.04);else playSound(100,.02);
 updateUI();
}

function throwGrenade(){
 if(!state.running||state.paused||state.dead||state.grenades<=0)return;
 state.grenades--;
 notify('Boom! Grenade thrown!');
 for(const z of zombies){
  if(z.dead)continue;
  if(dist(player,z)<220){z.hp-=120;z.hit=.3;if(z.hp<=0){z.dead=true;state.kills++;}}
 }
 for(let i=0;i<25;i++)particles.push({x:player.x+rand(-50,50),y:player.y+rand(-50,50),vx:rand(-120,120),vy:rand(-120,120),life:.4,color:'#ff5d73'});
 playSound(80,.2);updateUI();
}

function damagePlayer(amount){
 if(player.dodge>0)return;
 state.hp-=amount;player.flash=.15;playSound(60,.08);
 if(state.hp<=0){
  state.hp=0;state.dead=true;state.running=false;
  state.score=state.kills*100+state.day*50+state.level*30;
  save();
  $('endTitle').textContent='☠ You were overwhelmed';
  $('endText').textContent='Days: '+state.day+' · Kills: '+state.kills+' · Score: '+state.score;
  setOverlay(ui.end);
 }
 updateUI();
}

function playSound(freq,duration){
 if(!state.sound)return;
 try{let AC=window.AudioContext||window.webkitAudioContext;if(!window._ac)window._ac=new AC();let ac=window._ac,osc=ac.createOscillator(),gain=ac.createGain();osc.frequency.value=freq;osc.type='triangle';gain.gain.value=.03;gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);osc.connect(gain);gain.connect(ac.destination);osc.start();osc.stop(ac.currentTime+duration)}catch(e){}
}

function update(dt){
 if(!state.running||state.paused||state.dead)return;
 player.cooldown=Math.max(0,player.cooldown-dt);
 player.attack=Math.max(0,player.attack-dt);
 player.dodge=Math.max(0,player.dodge-dt);
 player.flash=Math.max(0,player.flash-dt);

 let mx=move.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 let my=move.y+(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
 let ml=Math.hypot(mx,my);
 if(ml>1){mx/=ml;my/=ml}
 if(ml>.08&&player.dodge<=0){
  player.x+=mx*player.speed*dt;
  player.y+=my*player.speed*dt;
  player.angle=Math.atan2(my,mx);
 }
 if(player.dodge>0){
  player.x+=Math.cos(player.angle)*player.speed*2.2*dt;
  player.y+=Math.sin(player.angle)*player.speed*2.2*dt;
 }
 player.x=clamp(player.x,-world.w/2,world.w/2);
 player.y=clamp(player.y,-world.h/2,world.h/2);

 spawnTimer-=dt;
 if(spawnTimer<=0&&zombies.filter(z=>!z.dead).length<16){spawnZombie();spawnTimer=Math.max(.8,2.2-state.day*.05)}
 if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=0;}

 for(const it of items){
  if(dist(player,it)<30){
   if(it.type==='hp'){state.hp=Math.min(state.maxHp,state.hp+it.val);notify('+HP Healed!')}
   else{state.coins+=it.val;notify('+'+it.val+' Coins!')}
   it.collected=true;updateUI();
  }
 }
 items=items.filter(it=>!it.collected);

 for(const z of zombies){
  if(z.dead)continue;
  z.hit=Math.max(0,z.hit-dt);
  z.attack-=dt;
  let dx=player.x-z.x,dy=player.y-z.y,d=Math.hypot(dx,dy)||1;
  if(d>z.r+player.r+4){
   z.x+=dx/d*z.speed*dt;
   z.y+=dy/d*z.speed*dt;
  }else if(z.attack<=0){
   damagePlayer(z.damage);
   z.attack=1.2+Math.random()*.4;
  }
 }
 zombies=zombies.filter(z=>!z.dead||Math.random()<.02);

 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
 particles=particles.filter(p=>p.life>0);
 for(const f of floatTexts){f.y-=20*dt;f.life-=dt}
 floatTexts=floatTexts.filter(f=>f.life>0);

 camera.x+=(player.x-camera.x)*Math.min(1,dt*6);
 camera.y+=(player.y-camera.y)*Math.min(1,dt*6);

 if(toastTimer>0){
  toastTimer-=dt;
  if(toastTimer<=0) ui.toast.classList.add('hidden');
 }
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#202e24';ctx.fillRect(0,0,W,H);
 ctx.save();
 ctx.translate(W/2-camera.x,H/2-camera.y);

 ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;let step=120;
 for(let x=-world.w/2;x<=world.w/2;x+=step){ctx.beginPath();ctx.moveTo(x,-world.h/2);ctx.lineTo(x,world.h/2);ctx.stroke()}
 for(let y=-world.h/2;y<=world.h/2;y+=step){ctx.beginPath();ctx.moveTo(-world.h/2,y);ctx.lineTo(world.h/2,y);ctx.stroke()}

 for(const it of items){
  ctx.fillStyle=it.type==='hp'?'#ff5d73':'#ffd166';
  ctx.beginPath();ctx.arc(it.x,it.y,8,0,Math.PI*2);ctx.fill();
 }

 for(const z of zombies){
  if(z.dead)continue;
  ctx.save();ctx.translate(z.x,z.y);
  ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(2,z.r*.7,z.r,z.r*.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=z.hit?'#fff':z.color;
  ctx.beginPath();ctx.arc(0,0,z.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e65e67';ctx.fillRect(-z.r,z.r+4,z.r*2,3);
  ctx.fillStyle='#65e6a7';ctx.fillRect(-z.r,z.r+4,z.r*2*clamp(z.hp/z.maxHp,0,1),3);
  ctx.restore();
 }

 ctx.save();ctx.translate(player.x,player.y);
 ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(2,8,16,9,0,0,Math.PI*2);ctx.fill();
 ctx.rotate(player.angle);
 let skinColors=['#5ba5e8','#ffd166','#ff5d73','#65e6a7'];
 ctx.fillStyle=player.flash?'#fff':(skinColors[state.skin]||skinColors[0]);
 ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#dbefff';ctx.beginPath();ctx.arc(5,-3,4,0,Math.PI*2);ctx.fill();

 let wpn=weapons[state.weapon]||weapons[0];
 if(wpn.kind==='gun'){
  ctx.fillStyle='#c3ccd6';ctx.fillRect(8,0,18,6);
 }else{
  ctx.strokeStyle='#f1d19a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(8,3);ctx.lineTo(24,3);ctx.stroke();
 }
 ctx.restore();

 for(const p of particles){ctx.globalAlpha=clamp(p.life/.3,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}
 for(const f of floatTexts){ctx.globalAlpha=clamp(f.life/0.35,0,1);ctx.fillStyle=f.color;ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)}
 ctx.globalAlpha=1;ctx.restore();

 drawMinimap();
}

function drawMinimap(){
 miniCtx.clearRect(0,0,110,110);
 miniCtx.fillStyle='#111923';miniCtx.fillRect(0,0,110,110);
 let scale=110/world.w;
 for(const z of zombies){
  if(z.dead)continue;
  let mx=55+(z.x-player.x)*scale,my=55+(z.y-player.y)*scale;
  if(mx>=0&&mx<=110&&my>=0&&my<=110){miniCtx.fillStyle='#ff5d73';miniCtx.fillRect(mx-1,my-1,2,2)}
 }
 miniCtx.fillStyle='#65e6a7';miniCtx.beginPath();miniCtx.arc(55,55,3,0,Math.PI*2);miniCtx.fill();
}

function loop(t){
 let dt=Math.min(.033,(t-(loop.last||t))/1000);
 loop.last=t;update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const stick=$('stick'),knob=$('knob');
function setStick(e){
 let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.35,len=Math.hypot(dx,dy)||1;
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 move.x=dx/max;move.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;
}
function resetStick(){stickPointer=null;move.x=move.y=0;knob.style.transform='translate(0,0)'}
if(stick){
 stick.addEventListener('pointerdown',e=>{stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e)});
 stick.addEventListener('pointermove',e=>{if(stickPointer===e.pointerId)setStick(e)});
 stick.addEventListener('pointerup',e=>{if(stickPointer===e.pointerId)resetStick()});
 stick.addEventListener('pointercancel',resetStick);
}

canvas.addEventListener('pointerdown',e=>{if(e.clientX>W*.4&&e.clientY>80&&e.clientY-140){dragLook=true;lookLastX=e.clientX;canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(dragLook){let dx=e.clientX-lookLastX;player.angle+=dx*.008;lookLastX=e.clientX}});
canvas.addEventListener('pointerup',()=>dragLook=false);

addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyJ')attack('light');if(e.code==='KeyK')attack('heavy');if(e.code==='KeyL')throwGrenade()});
addEventListener('keyup',e=>{keys[e.code]=false});

$('lightBtn').onclick=()=>attack('light');
$('heavyBtn').onclick=()=>attack('heavy');
$('dodgeBtn').onclick=()=>{if(player.dodge<=0){player.dodge=.25;playSound(300,.04)}};
$('grenadeBtn').onclick=throwGrenade;

$('startBtn').onclick=resetRun;
$('continueBtn').onclick=()=>{resetRun();notify('Welcome back!')};
$('pauseBtn').onclick=()=>{if(!state.running)return;state.paused=true;setOverlay(ui.pause)};
$('resumeBtn').onclick=()=>{state.paused=false;setOverlay(null)};
$('saveBtn').onclick=save;
$('mainMenuBtn').onclick=()=>{state.running=false;setOverlay(ui.menu)};

$('bagBtn').onclick=()=>{state.paused=true;renderBag();setOverlay(ui.bag)};
$('closeBagBtn').onclick=()=>{state.paused=false;setOverlay(null)};
$('upgradeBtn').onclick=()=>{
 let cost=Math.floor(150*Math.pow(1.7,state.upgrade));
 if(state.coins<cost){notify('Need '+cost+' coins!');return}
 state.coins-=cost;state.upgrade++;notify('Weapon upgraded!');renderBag();updateUI();save();
};

$('profileBtn').onclick=()=>{state.paused=true;renderProfile();setOverlay(ui.profile)};
$('menuMultiBtn').onclick=()=>setOverlay(ui.multi);
$('multiBtn').onclick=()=>{state.paused=true;setOverlay(ui.multi)};
$('closeMultiBtn').onclick=()=>{state.paused=false;setOverlay(null)};
$('closeProfileBtn').onclick=()=>{state.paused=false;setOverlay(null)};
$('saveProfileBtn').onclick=()=>{
 state.playerName=$('playerName').value.trim().slice(0,16)||'Survivor';
 state.countryFlag=$('countrySelect').value;
 save();setOverlay(null);state.paused=false;notify('Profile saved!');
};

$('menuRankBtn').onclick=()=>{renderRank();setOverlay(ui.rank)};
$('rankBtn').onclick=()=>{state.paused=true;renderRank();setOverlay(ui.rank)};
$('closeRankBtn').onclick=()=>{state.paused=false;setOverlay(null)};

$('againBtn').onclick=resetRun;
$('endMenuBtn').onclick=()=>setOverlay(ui.menu);

function renderBag(){
 let html='';
 weapons.forEach((w,i)=>{
  let owned=state.unlocked.includes(i),equipped=state.weapon===i;
  html+=`<div class="item"><b>${w.name}${equipped?' ✓':''}</b><small>${w.desc}</small>${owned?`<button data-equip="${i}" ${equipped?'disabled':''}>${equipped?'EQUIPPED':'EQUIP'}</button>`:`<button data-buy="${i}" ${state.coins<w.cost?'disabled':''}>Unlock (${w.cost}C)</button>`}</div>`;
 });
 $('weaponList').innerHTML=html;
 $('bagInfo').textContent='Coins: '+state.coins+' · Upgrade Bonus: +'+(state.upgrade*7)+' DMG';
 $('weaponList').querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{state.weapon=+b.dataset.equip;renderBag();save();notify('Equipped!')});
 $('weaponList').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
  let i=+b.dataset.buy,w=weapons[i];
  if(state.coins<w.cost)return;
  state.coins-=w.cost;state.unlocked.push(i);state.weapon=i;updateUI();renderBag();save();notify('Unlocked!');
 });
}

function renderProfile(){
 $('playerName').value=state.playerName;$('countrySelect').value=state.countryFlag;
 let skinHtml='';
 skins.forEach((sk,i)=>{
  let owned=(state.skinUnlocked||[0]).includes(i),active=state.skin===i;
  skinHtml+=`<div class="profilecard"><b>${sk.name}</b><small>${owned?'Owned':sk.cost+'C'}</small><button data-skin="${i}" ${active?'disabled':''}>${active?'EQUIPPED':owned?'EQUIP':'BUY'}</button></div>`;
 });
 $('skinList').innerHTML=skinHtml;

 let petHtml='';
 pets.forEach((p,i)=>{
  let active=state.pet===i;
  petHtml+=`<div class="profilecard"><b>${p.name}</b><small>${p.buff}</small><button data-pet="${i}" ${active?'disabled':''}>${active?'ACTIVE':'SELECT'}</button></div>`;
 });
 $('petList').innerHTML=petHtml;

 $('skinList').querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{
  let i=+b.dataset.skin;
  if(!state.skinUnlocked.includes(i)){
   if(state.coins<skins[i].cost){notify('Not enough coins');return}
   state.coins-=skins[i].cost;state.skinUnlocked.push(i);
  }
  state.skin=i;renderProfile();save();
 });
 $('petList'].querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{
  state.pet=+b.dataset.pet;renderProfile();save();notify('Pet selected!');
 });
}

function renderRank(){
 let score=state.score||0;
 let tier='Bronze 🥉';
 if(score>500)tier='Silver 🥈';
 if(score>1500)tier='Gold 🥇';
 if(score>3500)tier='Platinum 💠';
 if(score>7000)tier='Diamond 💎';
 if(score>12000)tier='Survivor Legend 👑';

 $('tierBox').innerHTML=`<h3>Your Tier: ${tier}</h3><p>Total Score: ${score} · Kills: ${state.kills}</p>`;
 $('leaderboardList').innerHTML=`
  <div class="item" style="margin-bottom:4px">1. 🇲🇲 Zaw Min (Legend) - 18,450 pts</div>
